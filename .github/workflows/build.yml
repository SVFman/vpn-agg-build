name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o vpn-aggregator.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: vpn-aggregator
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: vpn-aggregator/app/build/outputs/apk/debug/app-debug.apk
