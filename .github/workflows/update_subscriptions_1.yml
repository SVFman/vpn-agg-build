name: Update VPN Subscriptions

on:
  schedule:
    # Каждые 3 часа: один запуск собирает все подписки одним коммитом.
    # Это исключает гонки пуша между workflow и экономит минуты Actions.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим сборки: trusted / cepreu54 / checked / all"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: subscription-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aggregate subscriptions
        run: python scripts/aggregate_subscription.py --mode "${{ inputs.mode || 'all' }}"

      - name: Commit updated subscriptions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update subscriptions"
          file_pattern: "subscription/*.txt"
