name: Update Cepreu54 Subscription

on:
  schedule:
    # Запуск каждые 6 часов (на 17-й минуте, чтобы избежать конфликтов git push с другими workflow)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cepreu54:
    runs-on: ubuntu-latest
    concurrency:
      group: subscription-git-push
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cepreu54 subscription aggregation
        run: python scripts/aggregate_subscription.py --mode cepreu54

      - name: Commit and push updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription/cepreu54.txt subscription/cepreu54_base64.txt
          if git diff --staged --quiet; then
            echo "Изменений в подписке Cepreu54 нет."
          else
            git commit -m "chore: update cepreu54 subscription"
            git pull --rebase origin main
            git push
          fi
