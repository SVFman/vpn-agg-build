name: Update VPN Subscriptions

on:
  schedule:
    # Каждые 3 часа: один запуск собирает все подписки одним коммитом.
    # Это исключает гонки пуша между workflow и экономит минуты Actions.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим сборки: trusted / cepreu54 / checked / all"
        required: false
        default: "all"
      allow_shrink:
        description: "Разрешить запись при деградации (<50% строк прежнего файла)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: subscription-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aggregate subscriptions
        # Пользовательский ввод передаётся через env, а не интерполяцией в shell:
        # значение не может вырваться из аргумента --mode (argparse choices отсеет мусор).
        env:
          MODE: ${{ inputs.mode || 'all' }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          ARGS=""
          if [ "$ALLOW_SHRINK" = "true" ]; then ARGS="--allow-shrink"; fi
          python scripts/aggregate_subscription.py --mode "$MODE" $ARGS

      - name: Ensure cache directory exists
        # git add падает (fatal: pathspec ... did not match), если указанного пути нет.
        # Каталог и status.json создаются заранее, чтобы шаблон ниже всегда совпадал.
        run: |
          mkdir -p mirrors
          [ -f mirrors/status.json ] || echo '{}' > mirrors/status.json

      - name: Commit updated subscriptions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update subscriptions"
          file_pattern: "subscription/*.txt mirrors"
