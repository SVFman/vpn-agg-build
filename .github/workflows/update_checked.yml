name: Update Checked Subscription (TCP/TLS)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subscription-commit
  cancel-in-progress: false

jobs:
  build-checked:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TCP/TLS validation
        run: python scripts/aggregate_subscription.py --mode checked

      - name: Commit updated Checked subscription
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update checked subscription (TCP/TLS)"
          file_pattern: "subscription/checked*.txt"
