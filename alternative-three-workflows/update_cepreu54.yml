name: Update Cepreu54 Subscription

on:
  schedule:
    # Минуты разнесены с другими workflow (0/20/40), чтобы не копиться в одной очереди.
    # Защиту от гонок обеспечивает единая concurrency-группа ниже, а не сдвиг cron.
    - cron: '40 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Единая группа для всех workflow с коммитом подписки —
# исключает гонки git push между разными job.
concurrency:
  group: subscription-commit
  cancel-in-progress: false

jobs:
  update-cepreu54:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cepreu54 subscription aggregation
        run: python scripts/aggregate_subscription.py --mode cepreu54

      - name: Commit and push updated subscription
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update cepreu54 subscription"
          file_pattern: "subscription/cepreu54*.txt"
